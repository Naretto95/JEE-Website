# --- Server ---
server.port=${SERVER_PORT:8080}
server.address=0.0.0.0

# --- View resolution (JSP) ---
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# --- Database ---
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecommerce?createDatabaseIfNotExist=true&characterEncoding=UTF-8&autoReconnect=yes}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.datasource.data=classpath:data.sql
spring.datasource.initialization-mode=always

# --- File uploads (product images) ---
spring.servlet.multipart.max-file-size=30MB
spring.servlet.multipart.max-request-size=30MB

# --- Contact form ---
# Recipient of messages submitted through the site's contact form.
contact.recipient-email=${CONTACT_RECIPIENT_EMAIL:narettolilian@hotmail.fr}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

